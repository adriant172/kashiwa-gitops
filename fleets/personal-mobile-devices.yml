# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
# personal-mobile-devices.yml
#
# Use this fleet manifest to configure controls, software,
# and settings that apply only to computing devices (hosts)
# in this particular fleet.
#
# > Note: By convention, the "📱🔐 Personal mobile devices"
# > fleet is where employee-owned iPhone and Android phones
# > are enrolled, for example as part of a BYOD ("bring your
# > own device") program.  This allows for clear separation
# > and encourages employee freedom and privacy.
#
# To see all supported options, check out:
#   • https://fleetdm.com/docs/configuration/yaml-files
#
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
name: "📱🔐 Personal mobile devices"

###########################################################
# Failing-policy alerts (same listener as Workstations).
# Policies opt in with `webhooks_and_tickets_enabled: true`.
###########################################################
settings:
  webhook_settings:
    failing_policies_webhook:
      enable_failing_policies_webhook: true
      destination_url: $FLEET_ACTIVITIES_WEBHOOK_URL
      host_batch_size: 0

controls:
  setup_experience:
    ###########################################################
    # Uncomment to use single-sign on (SSO) to authenticate
    # end users enrolling their personal device.
    #
    # Read more:
    #   • https://fleetdm.com/docs/configuration/yaml-files#end-user-authentication
    #   • https://fleetdm.com/guides/setup-experience#require-idp-authentication
    ###########################################################
    # enable_end_user_authentication: true

  ###########################################################
  # Presets, restrictions, and configs
  #
  # > Since the mobile devices in this fleet are personal
  # > devices owned by employees, it can be appropriate to
  # > cherry-pick only a very limited set of restrictions
  # > and presets to maximize privacy and employee freedom.
  #
  # For more, see:
  #   • https://fleetdm.com/docs/configuration/yaml-files#apple-settings-and-windows-settings
  #   • https://fleetdm.com/docs/configuration/yaml-files#android-settings
  ###########################################################
  apple_settings:
    configuration_profiles:
      # … e.g.
      # - path: ../lib/ios/declaration-profiles/Passcode settings.json
      # - path: ../lib/ios/configuration-profiles/self-service.mobileconfig
  android_settings:
    configuration_profiles:
    certificates:

  ###########################################################
  # Managed OS updates
  #
  # To enable and enforce managed OS updates on iOS/iPadOS,
  # uncomment `ios_updates` and `ipados_updates`.
  #
  # See also:
  #   • https://fleetdm.com/docs/configuration/yaml-files#ios-updates
  #   • https://fleetdm.com/docs/configuration/yaml-files#ipados-updates
  #   • https://fleetdm.com/guides/enforce-os-updates#apple-macos-ios-and-ipados-end-user-experience
  ###########################################################
  # ios_updates:
  #   deadline: "2030-04-01"
  #   minimum_version: "18.5"
  #
  # iPadOS: same rule as Workstations Macs. Nothing older than
  # iPadOS 26.5 after the end of 2026. Apple only enforces versions it
  # still offers, and 26.5 isn't offered anymore, so the target is 26.7.3
  # (the only iPadOS 26 version offered as of 2026-11-12).
  ipados_updates:
    deadline: "2026-12-31"
    minimum_version: "26.7.3"

###########################################################
# Policies
#
# Kept in a fleet-specific subfolder so the Workstations
# `platforms/windows/policies/*.yml` glob doesn't pick them up.
###########################################################
policies:
  # Installs Cloudflare WARP on any Windows device that doesn't have it.
  - path: ../platforms/windows/policies/personal-mobile-devices/cloudflare-warp-installed.yml

###########################################################
# Software
###########################################################
software:
  fleet_maintained_apps:
    # Cloudflare WARP (Cloudflare One Client) for Windows. Not in
    # self-service: the "Windows - Cloudflare WARP installed" policy
    # installs it automatically. The catalog installer is x64, so it's
    # limited to x86-based Windows hosts.
    - slug: cloudflare-warp/windows
      self_service: false
      labels_include_any:
        - x86-based Windows hosts
      # Runs after every WARP install to apply our configuration.
      post_install_script:
        path: ../platforms/windows/software/cloudflare-warp-post-install.ps1

  ###########################################################
  # Apps to make available from the Apple App Store or Google Play
  ###########################################################
  app_store_apps:
    ###########################################################
    # iOS apps
    ###########################################################
    # …
    # - app_store_id: "618783545" # Slack
    #   display_name: "Slack"
    #   self_service: true
    #   setup_experience: true
    #   platform: ios
    #   categories:
    #     - "Communication"

    ###########################################################
    # iPadOS apps
    ###########################################################
    # …
    # - app_store_id: "618783545" # Slack
    #   display_name: "Slack"
    #   self_service: true
    #   setup_experience: true
    #   platform: ipados
    #   categories:
    #     - "Productivity"
    #     - "Communication"

    ###########################################################
    # Android apps
    ###########################################################
    # …
    # - app_store_id: "com.Slack" # Slack
    #   platform: android
    #   display_name: "Slack"
    #   self_service: true
    #   setup_experience: true
