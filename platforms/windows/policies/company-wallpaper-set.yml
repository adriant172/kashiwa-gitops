- name: Windows - Company wallpaper set
  # Passes when the wallpaper image is on disk and every signed-in user's
  # hive has the "Desktop Wallpaper" policy pointing at it. Hives of users
  # who aren't signed in aren't loaded, so they're not checked here.
  query: |
    SELECT 1 WHERE
      EXISTS (
        SELECT 1 FROM file
        WHERE directory = 'C:\ProgramData\KashiwaOakWorks\Wallpaper'
          AND filename LIKE 'wallpaper.%'
      )
      AND (
        SELECT COUNT(*) FROM registry
        WHERE key = 'HKEY_USERS'
          AND name LIKE 'S-1-5-21-%'
          AND name NOT LIKE '%_Classes'
      ) <= (
        SELECT COUNT(*) FROM registry
        WHERE path LIKE 'HKEY_USERS\%\Software\Microsoft\Windows\CurrentVersion\Policies\System\Wallpaper'
          AND data LIKE 'C:\ProgramData\KashiwaOakWorks\Wallpaper\wallpaper.%'
      );
  critical: false
  description: Windows workstations should show the company desktop wallpaper.
  resolution: |
    Fleet sets the wallpaper automatically when this check fails. It appears the next time you sign in.
  platform: windows
  run_script:
    path: ../scripts/set-company-wallpaper.ps1
